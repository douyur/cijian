name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare the website package
        id: artifact
        run: |
          test -f dist/index.html
          echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the website package
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ./dist

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded package to become available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          api_path="repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          for attempt in {1..12}; do
            if [[ "$(gh api "$api_path" --jq '.id' 2>/dev/null)" == "$ARTIFACT_ID" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "The uploaded Pages artifact ${ARTIFACT_ID} is unavailable." >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.upload.outputs.artifact_name }}
